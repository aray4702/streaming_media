# Mechanical dispatcher for the agent loop (agents/tools/dispatch.py,
# agents/coordinator.md). Turns on auto-merge, keeps one approved PR up to
# date, and starts Fixer, Reviewer, Tester, cloud Coordinator and Builder routine runs,
# on repo events and every 15 minutes.
#
# Mode: the repository variable SM_DISPATCH_MODE. Anything other than "live"
# is a dry run that only writes its decisions to the job summary.
# Secrets: SM_APP_ID, SM_APP_PRIVATE_KEY (the Reviewer App, already used by
# reviewer-relay.yml), SM_ROUTINE_FIXER_TOKEN, SM_ROUTINE_REVIEWER_TOKEN,
# SM_ROUTINE_TESTER_TOKEN, SM_ROUTINE_COORDINATOR_TOKEN, SM_ROUTINE_BUILDER_TOKEN and SM_ROUTINE_FIXER_B_TOKEN (each routine's API
# trigger token from
# claude.ai/code/routines), and SM_DISCORD_WEBHOOK (the Owner's channel, for
# forwarding NEEDS YOU escalations).
name: dispatcher
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows: [ci]
    types: [completed]
  pull_request_target:
    types: [closed, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted]
  issues:
    types: [closed, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
  actions: read  # the FLOW rule reads CI runs and jobs (SM_ACTIONS_TOKEN)
concurrency:
  group: dispatcher
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Always main: the script and its rules never come from a PR branch.
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SM_APP_ID }}
          private-key: ${{ secrets.SM_APP_PRIVATE_KEY }}
      - name: Dispatch
        env:
          # An App token, not GITHUB_TOKEN: merges made with GITHUB_TOKEN don't
          # start main's CI, and the parity data would not be published.
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SM_ROUTINE_FIXER_TOKEN: ${{ secrets.SM_ROUTINE_FIXER_TOKEN }}
          SM_ROUTINE_REVIEWER_TOKEN: ${{ secrets.SM_ROUTINE_REVIEWER_TOKEN }}
          SM_ROUTINE_COORDINATOR_TOKEN: ${{ secrets.SM_ROUTINE_COORDINATOR_TOKEN }}
          SM_ROUTINE_TESTER_TOKEN: ${{ secrets.SM_ROUTINE_TESTER_TOKEN }}
          SM_ROUTINE_BUILDER_TOKEN: ${{ secrets.SM_ROUTINE_BUILDER_TOKEN }}
          SM_ROUTINE_FIXER_B_TOKEN: ${{ secrets.SM_ROUTINE_FIXER_B_TOKEN }}
          SM_DISCORD_WEBHOOK: ${{ secrets.SM_DISCORD_WEBHOOK }}
          SM_ACTIONS_TOKEN: ${{ github.token }}  # Actions API reads for the FLOW rule
          MODE: ${{ vars.SM_DISPATCH_MODE }}
        run: |
          set -o pipefail  # a crash in dispatch.py fails the run instead of hiding behind tee
          flag=""; [ "$MODE" = live ] && flag="--live"
          { echo '```'; python3 agents/tools/dispatch.py $flag --verbose; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
