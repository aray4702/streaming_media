# Builds and verifies the library on every platform family it targets.
# Desktop/server and WebAssembly jobs run the full unit + e2e + benchmark
# suites; mobile and embedded jobs cross-compile (and run the tests under
# QEMU for Linux ARM). Benchmark speed budgets are scaled for slow runners.
# The test bench job compares every scenario against testbench/baseline.json;
# `ci-ok` aggregates every job and is the required check for merging.
# `merge_group` runs the same jobs on the merge queue's commit (the PR on top
# of the PRs ahead of it), so main is tested as it will be after the merge.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  ci-label-clear:
    # A new commit is not yet verified: drop `ci-passed` (added by ci-ok below)
    # at the start of every PR run. The label starts the Reviewer routine.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {pull-requests: write}
    steps:
      - run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/ci-passed" >/dev/null 2>&1 || true
        env: {GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.number }}"}
  host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, cc: gcc-13, cxx: g++-13}
          - {os: ubuntu-24.04, cc: clang-18, cxx: clang++-18}
          - {os: macos-14, cc: clang, cxx: clang++}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env: {CC: "${{ matrix.cc }}", CXX: "${{ matrix.cxx }}", SM_BENCH_BUDGET_SCALE: "4"}
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset native && cmake --build --preset native -j 4
      - run: ctest --preset native -j 4
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset native-asan && cmake --build --preset native-asan -j 4
      - run: ctest --preset native-asan -j 4
  embedded-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset embedded && cmake --build --preset embedded -j 4
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env: {SM_BENCH_BUDGET_SCALE: "4"}
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - run: EMSCRIPTEN_ROOT=$EMSDK/upstream/emscripten cmake --preset wasm && cmake --build --preset wasm -j 4
      - run: ctest --preset wasm -j 4
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: out/wasm/web
  linux-aarch64:
    # Cross toolchain + functional tests under QEMU. Speed gates are skipped
    # here (they would time the emulator); linux-arm64 runs them natively.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      # The Azure Ubuntu mirror sometimes serves these ~70 MB at ~30 kB/s (26
      # minutes on 2026-10-22), so the .deb files are kept between runs.
      - uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-aarch64-ubuntu-24.04-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-aarch64-ubuntu-24.04-
      - run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-cache" -o APT::Sandbox::User=root \
            g++-aarch64-linux-gnu qemu-user
          sudo chown -R "$USER" ~/apt-cache
      - run: cmake --preset linux-aarch64 && cmake --build --preset linux-aarch64 -j 4
      - run: cd out/linux-aarch64 && ctest -j 4 --output-on-failure -LE bench
  linux-arm64:
    # Native Arm64 Linux (robots, Jetson, Graviton): full suite incl. speed gates.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env: {CC: gcc-13, CXX: g++-13, SM_BENCH_BUDGET_SCALE: "4"}
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset native && cmake --build --preset native -j 4
      - run: ctest --preset native -j 4
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy: {matrix: {preset: [android-arm64, android-armv7]}}
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset ${{ matrix.preset }} -DSM_BUILD_TESTS=OFF -DSM_BUILD_BENCH=OFF -DSM_BUILD_EXAMPLES=OFF
      - run: cmake --build out/${{ matrix.preset }} -j 4
  ios:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset ios && cmake --build out/ios --config Release -- -sdk iphoneos CODE_SIGNING_ALLOWED=NO
  testbench:
    # Canonical platform for testbench/baseline.json (same as the cloud agents).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env: {CC: gcc-13, CXX: g++-13}
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset native -DSM_BUILD_BENCH=OFF && cmake --build --preset native -j 4 --target sm_testbench
      - name: Run scenarios
        run: out/native/testbench/sm_testbench --quiet --json=testbench-results.json testbench/scenarios/*.scn
      - name: Compare with baseline
        run: |
          {
            echo "## Test bench vs baseline"
            python3 tools/testbench_compare.py testbench/baseline.json testbench-results.json --markdown
          } >> "$GITHUB_STEP_SUMMARY"
          python3 tools/testbench_compare.py testbench/baseline.json testbench-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testbench-results
          path: testbench-results.json
  compare-webrtc:
    # sm_compare against a prebuilt libwebrtc (compare/README.md). Keeps the
    # comparison building on the agents' platform and puts the table and the
    # parity report (tools/parity_report.py) in the job summary. libc++ for the
    # prebuilt binary needs clang >= 21. On main the results are also published
    # to the `parity-data` branch, and on a PR to `parity-data-pr` under
    # pr/<number>/; the agents read both through
    # raw.githubusercontent.com (the Actions artifact host and github.io are
    # not reachable from their sandbox).
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions: {contents: write}
    env: {COMPARE_SEEDS: "10"}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/test_parity_report.py
      - uses: actions/cache@v4
        with:
          path: out/webrtc-deps
          key: webrtc-deps-ubuntu-24.04-${{ hashFiles('compare/webrtc/fetch.sh') }}
      - run: compare/webrtc/fetch.sh
      # clang 21 comes from apt.llvm.org through apt; keep its .deb files
      # between runs too (the step once took 55 minutes).
      - uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-llvm21-ubuntu-24.04-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-llvm21-ubuntu-24.04-
      - run: |
          mkdir -p ~/apt-cache/partial
          printf 'Dir::Cache::Archives "%s/apt-cache";\nAPT::Sandbox::User "root";\n' "$HOME" | sudo tee /etc/apt/apt.conf.d/90sm-apt-cache
          # Download first and fail loudly: piping into bash hides a failed
          # download (bash runs an empty script and succeeds), and the next
          # step then reports a missing compiler instead.
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 21
          command -v clang++-21 >/dev/null || { echo "::error::clang++-21 is not installed after llvm.sh (apt.llvm.org)"; exit 1; }
          sudo chown -R "$USER" ~/apt-cache
      - run: CXX=clang++-21 cmake -S compare/webrtc -B out/compare -DCMAKE_BUILD_TYPE=Release && cmake --build out/compare -j 4
      - name: Compare
        run: |
          # On main, also trace every scenario's first seed (published as traces/
          # below). PR runs don't, since parity-data-pr keeps every PR's files.
          TRACE_ALL=""
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            mkdir -p traces && TRACE_ALL="--trace-all-dir=traces"
          fi
          out/compare/sm_compare --seeds=$COMPARE_SEEDS --json=compare-webrtc.json $TRACE_ALL testbench/scenarios/*.scn | tee compare-webrtc.txt
          { echo '## streaming_media vs libwebrtc'; echo '```'; cat compare-webrtc.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Parity report
        run: |
          # On a PR, compare with the report published for main; without it the
          # report still lists the gaps, only the closed/opened part is left out.
          BASE=""
          if [ "${{ github.event_name }}" = pull_request ] &&
             curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/parity-data/compare-webrtc.json" -o base-compare.json; then
            BASE="--base base-compare.json"
          fi
          python3 tools/parity_report.py compare-webrtc.json --owners tools/parity_owners.json $BASE --markdown parity.md --json parity.json
          cat parity.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-webrtc
          path: |
            compare-webrtc.*
            parity.*
      - name: Publish to the parity-data branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir pub && cp compare-webrtc.json compare-webrtc.txt parity.json parity.md pub/
          cp -r traces pub/ && (cd pub/traces && ls *.csv > index.txt)
          printf 'Latest `compare-webrtc` results and parity report for main @ %s (written by the ci workflow, one commit per run).\nSee tools/parity_report.py.\n' "$GITHUB_SHA" > pub/README.md
          cd pub
          git init -q -b parity-data
          git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "compare-webrtc and parity report for $GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" parity-data
      - name: Publish PR results to the parity-data-pr branch
        # Same files for a PR, under pr/<number>/ on a branch of their own
        # (main's force-push above would wipe them), so agents can read
        # libwebrtc's column for scenarios a PR adds. Same-repo PRs only: a
        # fork's token can't push.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: "${{ github.token }}"
          PR: "${{ github.event.pull_request.number }}"
          HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
        run: |
          git init -q pub-pr && cd pub-pr
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            if git fetch -q --depth=1 origin parity-data-pr 2>/dev/null; then
              git checkout -q -f -B parity-data-pr FETCH_HEAD
            else
              git checkout -q --orphan parity-data-pr
              printf 'compare-webrtc results and parity report for pull requests, one directory per PR (pr/<number>/, HEAD names the commit), written by the ci workflow.\nResults for main are on the parity-data branch.\n' > README.md
            fi
            rm -rf "pr/$PR" && mkdir -p "pr/$PR"
            cp ../compare-webrtc.json ../compare-webrtc.txt ../parity.json ../parity.md "pr/$PR/"
            # Prune results of PRs closed more than 7 days ago, so the
            # branch keeps only what agents may still read.
            cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
            old=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100" \
                    --jq ".[] | select(.closed_at < \"$cutoff\") | .number" 2>/dev/null || true)
            for n in $old; do if [ -d "pr/$n" ]; then git rm -rq "pr/$n"; fi; done
            printf 'PR #%s @ %s\n' "$PR" "$HEAD_SHA" > "pr/$PR/HEAD"
            git add -A
            git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "compare-webrtc for PR #$PR @ $HEAD_SHA" || exit 0
            git push -q origin parity-data-pr && exit 0
            sleep $((attempt * 5))
          done
          echo "could not publish to parity-data-pr after 5 attempts"; exit 1
  fix-record:
    # PRs that fix a found problem must add a regression scenario that fails
    # on the base commit, and a fix record (program.md section 6.5).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: read, issues: read, pull-requests: read}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 tools/check_fix_record.py
        env: {GH_TOKEN: "${{ github.token }}"}
  pages:
    # Publishes the browser demo (web/) built by the wasm job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {pages: write, id-token: write}
    environment: {name: github-pages, url: "${{ steps.deploy.outputs.page_url }}"}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
  ci-ok:
    # Single required status check: succeeds only if every job above did.
    if: always()
    needs: [host, sanitizers, embedded-config, wasm, linux-aarch64, linux-arm64, android, ios, testbench, compare-webrtc, fix-record]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {pull-requests: write}
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | python3 -c "
          import json, sys
          bad = {k: v['result'] for k, v in json.load(sys.stdin).items() if v['result'] != 'success'}
          print('failed jobs:', bad) if bad else print('all jobs passed')
          sys.exit(1 if bad else 0)"
      - name: Label the PR ci-passed
        # The label event starts the Reviewer routine right away instead of at
        # its next hourly run. Runs only when every job passed.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true  # the hourly Reviewer run still covers the PR
        env: {GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.number }}"}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f "labels[]=ci-passed" >/dev/null
