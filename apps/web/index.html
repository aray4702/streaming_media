<!doctype html>
<!--
  Web app for calls through the signaling service (#1102, C15): one page, no build step,
  the browser's own RTCPeerConnection. Protocol: docs/deploy/signaling.md.
  Query parameters (used by the tests): room=<code>&auto=1 joins at load; report=1 posts
  the call's state to POST /report once a second.
  Real-network calls (#1121, tools/real_calls.py):
    relay=1     iceTransportPolicy 'relay': TURN candidates only;
    ws=<url>    the signaling WebSocket (default: this page's host, /ws); /turn is still fetched from this page's host;
    converse=1  a scripted user instead of the microphone: 1.5 s of speech-like audio per turn, and the AI's reply
                timed from the end of that speech to its first audio played here (response_ms; less the AI
                endpointer's 600 ms: response_transport_ms), as sm_call_smoke and the test bench measure it;
                barge=1 also talks over every other reply 1 s into it (barge_in_stop_ms: the barge-in's start to
                the reply's audio stopping here); turns=<n> caps the turns;
    sched=<list> with converse=1 (#1124): the user is the browser's microphone with its audio processing on
                (getUserMedia echoCancellation, noiseSuppression and autoGainControl), fed a file whose turns
                follow this schedule (tools/real_calls.py writes both and starts Chrome with
                --use-file-for-fake-audio-capture): seconds from the file's start of each 1.5 s turn, "b" marking a
                barge-in, e.g. "4,7.8b,14.8". The page finds the first turn's end on its processed microphone and
                scores the turns at their scheduled times; the AI's audio plays out, so Chrome's echo canceller
                has it as its render signal, as our client's AEC3 has its playout;
    seconds=<s> hangs up after s seconds and, with result=1, POSTs one JSON line of the call's metrics to /result
                (getStats: candidate pair, RTT, loss, concealment, jitter buffer, available bitrate, video fps
                and freezes, plus the conversation timings).
  Group calls through the LiveKit SFU (C19, #1164; docs/deploy/livekit.md): the "Group" button, or group=1 with
  room=<code>&auto=1, joins the LiveKit room <code> with the official livekit-client SDK (vendored in
  vendor/livekit-client/, loaded from this server). The token comes from GET /lk-token (this page's host); the LiveKit
  URL is lk=<url>, else the one /lk-token returns, else this page's origin (nginx routes /rtc to LiveKit). The camera
  and microphone are published with simulcast (the SDK's default layers), video in codec=<h264|vp8|...> (default
  h264, which every client here decodes); relay=1 sets iceTransportPolicy 'relay'. The call is a grid of up to 6
  tiles (C20): this page's camera first ("You"), then one tile per remote participant from the moment it joins, each
  with its video (its initials when the camera is off), a mic-off badge, a green border while LiveKit counts it among
  the active speakers (the server's audio levels), a level bar and a stats line (audio kbps, loss, jitter, video size,
  fps, codec); joins and leaves are logged under the grid. Mute, Video (the camera) and Hang up; n/6 in the room.
  report=1 posts report.group: per remote participant the received audio and video, its audio level, speaking, mic
  and camera state and stats; this page's own state; the active speakers, every speaker seen, who joined and left
  since this page joined and the room's count. For the tests:
    mic=0       join with the microphone published but muted (Mute unmutes it);
    cam=0       join with the camera off (Video starts it);
    leave=<s>   leave the room (as Hang up does) s seconds after joining;
    dtx=0       publish the microphone without Opus DTX (the SDK turns it on), so a quiet microphone keeps sending.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>streaming_media call</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 1em; }
  video { width: 320px; background: #222; margin: 2px; }
  #stats { white-space: pre; font: 12px monospace; }
  /* Group mode (C20): 1 column for 1 tile, 2 for 2-4, 3 for 5-6 (2 on a narrow screen). */
  #grid { display: grid; gap: 6px; margin: 6px 0; max-width: 1040px; grid-template-columns: minmax(0, 1fr); }
  #grid[data-cols="1"] { max-width: 720px; }
  #grid[data-cols="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #grid[data-cols="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 700px) { #grid[data-cols="3"] { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .tile { position: relative; aspect-ratio: 16 / 9; background: #222; border: 3px solid transparent;
          border-radius: 6px; overflow: hidden; }
  .tile.speaking { border-color: #22c55e; box-shadow: 0 0 0 2px #22c55e; }
  .tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; margin: 0; }
  .tile.local video { transform: scaleX(-1); }
  .tile.camoff video { visibility: hidden; }
  .tile .avatar { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
                  background: #2b2d38; color: #e5e7eb; font-size: 40px; font-weight: 600; }
  .tile.camoff .avatar { display: flex; }
  .tile .name { position: absolute; left: 6px; top: 4px; color: #fff; font-size: 12px; text-shadow: 0 0 2px #000; }
  .tile .micoff { display: none; margin-left: 4px; padding: 0 4px; border-radius: 3px; background: #dc2626; }
  .tile.muted .micoff { display: inline; }
  .tile .level { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: #22c55e;
                 transition: width 0.2s; }
  .tile .info { position: absolute; left: 6px; right: 6px; bottom: 7px; color: #eee; font: 11px monospace;
                line-height: 1.3; white-space: pre; overflow: hidden; text-shadow: 0 0 2px #000, 0 0 2px #000; }
  #events { white-space: pre; font: 12px monospace; color: #555; max-height: 8.5em; overflow-y: auto; }
</style>
<script src="vendor/livekit-client/livekit-client.umd.js"></script>
</head>
<body>
<h3>streaming_media call</h3>
<div>
  <input id="room" placeholder="room code" size="12">
  <button id="join">Join</button>
  <button id="group">Group</button>
  <button id="ai">Call the AI</button>
  <button id="mute" disabled>Mute</button>
  <button id="video" hidden>Stop video</button>
  <button id="hangup" disabled>Hang up</button>
  <span id="count"></span>
  <span id="state">idle</span>
</div>
<div><video id="local" autoplay muted playsinline></video><span id="remotes"></span></div>
<div id="grid" hidden></div>
<div id="events"></div>
<div id="stats"></div>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const myId = 'web-' + Math.random().toString(36).slice(2, 8);
let ws = null, room = null, stream = null, iceServers = [{urls: 'stun:stun.l.google.com:19302'}];
const calls = new Map();  // remote peer id -> {pc, video, pending: [candidates], prev: {t, bytes}}
const t0 = Date.now();

function setState(s) { $('state').textContent = s; }

async function loadTurn() {
  try {
    const r = await (await fetch('/turn?peer=' + myId)).json();
    // No STUN or TURN configured: /turn returns {"urls": []}. Chrome rejects an ICE server with no URLs,
    // so leave the list empty (host candidates only) instead of passing one (#1135).
    const urls = Array.isArray(r.urls) ? r.urls.filter(u => u) : [];
    if (!urls.length) { iceServers = []; return; }
    const server = {urls};
    if (r.username) { server.username = r.username; server.credential = r.credential; }
    iceServers = [server];
  } catch (e) { console.warn('no /turn', e); }
}

function send(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }

function makeCall(remote) {
  const pc = new RTCPeerConnection({iceServers, iceTransportPolicy: params.get('relay') === '1' ? 'relay' : 'all'});
  const video = document.createElement('video');
  video.autoplay = true; video.playsInline = true;
  $('remotes').appendChild(video);
  const call = {pc, video, pending: [], prev: null, stats: {}};
  calls.set(remote, call);
  for (const track of stream.getTracks()) pc.addTrack(track, stream);
  pc.ontrack = e => {
    video.srcObject = e.streams[0] || new MediaStream([e.track]);
    if (e.track.kind === 'audio' && talk) talk.listen(new MediaStream([e.track]));
  };
  pc.onicecandidate = e => {
    if (e.candidate) send({type: 'candidate', to: remote, candidate: e.candidate.candidate,
                           sdpMid: e.candidate.sdpMid, sdpMLineIndex: e.candidate.sdpMLineIndex});
  };
  pc.onconnectionstatechange = () => {
    setState(pc.connectionState);
    if (pc.connectionState === 'connected' && call.connectMs == null) call.connectMs = Date.now() - call.created;
  };
  call.created = Date.now();
  return call;
}

async function flush(call) {
  for (const c of call.pending.splice(0)) await call.pc.addIceCandidate(c).catch(() => {});
}

async function onMessage(m) {
  if (m.type === 'joined') {
    // The one that joins later sends the offer, to each peer already there.
    for (const peer of m.peers) {
      const call = makeCall(peer);
      await call.pc.setLocalDescription(await call.pc.createOffer());
      send({type: 'offer', to: peer, sdp: call.pc.localDescription.sdp});
    }
    setState(m.peers.length ? 'calling' : 'waiting for a peer');
  } else if (m.type === 'offer') {
    const call = calls.get(m.from) || makeCall(m.from);
    await call.pc.setRemoteDescription({type: 'offer', sdp: m.sdp});
    await flush(call);
    await call.pc.setLocalDescription(await call.pc.createAnswer());
    send({type: 'answer', to: m.from, sdp: call.pc.localDescription.sdp});
  } else if (m.type === 'answer') {
    const call = calls.get(m.from);
    if (call) { await call.pc.setRemoteDescription({type: 'answer', sdp: m.sdp}); await flush(call); }
  } else if (m.type === 'candidate') {
    const call = calls.get(m.from);
    const c = {candidate: m.candidate, sdpMid: m.sdpMid, sdpMLineIndex: m.sdpMLineIndex};
    if (!call) return;
    if (call.pc.remoteDescription) await call.pc.addIceCandidate(c).catch(() => {}); else call.pending.push(c);
  } else if (m.type === 'peer-left' || m.type === 'bye') {
    drop(m.peer || m.from);
  } else if (m.type === 'error') {
    setState('error: ' + m.reason);
  }
}

function drop(remote) {
  const call = calls.get(remote);
  if (!call) return;
  call.pc.close(); call.video.remove(); calls.delete(remote);
  if (!calls.size) setState('waiting for a peer');
}

async function join(code) {
  if (ws || !code) return;
  room = code;
  setState('starting');
  await loadTurn();
  const sched = params.get('converse') === '1' && params.get('sched');
  stream = await navigator.mediaDevices.getUserMedia(
      {audio: sched ? {echoCancellation: true, noiseSuppression: true, autoGainControl: true} : true, video: true});
  if (sched) {
    talk = new FileTalk(sched, stream.getAudioTracks()[0]);
  } else if (params.get('converse') === '1') {
    talk = new Talk();
    for (const t of stream.getAudioTracks()) { stream.removeTrack(t); t.stop(); }
    stream.addTrack(talk.track);
  }
  $('local').srcObject = stream;
  ws = new WebSocket(params.get('ws') || (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => send({type: 'join', room: code, peer: myId});
  ws.onmessage = e => onMessage(JSON.parse(e.data)).catch(err => console.error(err));
  ws.onclose = () => setState('disconnected');
  $('mute').disabled = $('hangup').disabled = false;
}

// --- Group calls through the LiveKit SFU (C19, C20) ------------------------------------------------------------------
// One LiveKit Room: the SDK runs the signaling (protobuf over WebSocket) and its two peer connections (publisher and
// subscriber). The grid holds this page's tile first, then one per remote participant from ParticipantConnected (before
// its tracks arrive) to ParticipantDisconnected. A tile shows the video, or the initials when there is none or the
// camera is muted; the mic-off badge; the active-speaker border (LiveKit's speaker updates, from the server's audio
// levels) and level bar (participant.audioLevel); and a stats line from getStats once a second (tick).
const GROUP_MAX = 6;  // The LiveKit server's room.max_participants (docs/deploy/livekit.md).
let group = null;  // {room, connected, local: tile, tiles: Map identity -> tile (remote participants),
                   //  joined: [identity], left: [identity], speakersSeen: Set, leaveTimer}
                   // tile: {participant, div, video, videoTrack, audio, level, info, tracks: Map sid -> track, prev}

function initials(identity) {
  return identity.split(/[^A-Za-z0-9]+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?';
}

function makeTile(participant, local) {  // this page's identity is known before the room connects
  const identity = local ? myId : participant.identity;
  const div = document.createElement('div'); div.className = local ? 'tile local' : 'tile';
  const video = document.createElement('video'); video.autoplay = true; video.playsInline = true; video.muted = true;
  video.addEventListener('resize', () => renderGroup());  // the first frame (or a new size)
  const avatar = document.createElement('div'); avatar.className = 'avatar'; avatar.textContent = initials(identity);
  const name = document.createElement('span'); name.className = 'name';
  const micoff = document.createElement('span'); micoff.className = 'micoff'; micoff.textContent = 'mic off';
  name.append(local ? `You (${identity})` : identity, micoff);
  const level = document.createElement('div'); level.className = 'level';
  const info = document.createElement('div'); info.className = 'info';
  div.append(video, avatar, name, info, level);
  $('grid').appendChild(div);
  return {participant, div, video, videoTrack: null, audio: null, level, info, tracks: new Map(), prev: null};
}

function micMuted(p) {
  const pub = p.getTrackPublication(window.LivekitClient.Track.Source.Microphone);
  return !pub || pub.isMuted;
}

function cameraOff(p) {
  const pub = p.getTrackPublication(window.LivekitClient.Track.Source.Camera);
  return !pub || pub.isMuted;
}

function logEvent(text) {
  const el = $('events'), lines = el.textContent ? el.textContent.split('\n') : [];
  lines.push(new Date().toTimeString().slice(0, 8) + ' ' + text);
  el.textContent = lines.slice(-50).join('\n');
  el.scrollTop = el.scrollHeight;
}

// The tiles' state from the participants (on every room event and once a second).
function renderGroup() {
  if (!group) return;
  const all = [group.local, ...group.tiles.values()];
  $('grid').dataset.cols = all.length <= 1 ? 1 : all.length <= 4 ? 2 : 3;
  for (const t of all) {
    const p = t.participant;
    t.div.classList.toggle('speaking', !!p.isSpeaking);
    t.div.classList.toggle('muted', micMuted(p));
    t.div.classList.toggle('camoff', !t.videoTrack || cameraOff(p) || !t.video.videoWidth);  // no frame yet: initials
    t.level.style.width = Math.round(100 * Math.min(1, p.audioLevel || 0)) + '%';
  }
  $('count').textContent = `${group.room.remoteParticipants.size + 1}/${GROUP_MAX}`;
}

async function joinGroup(code) {
  if (ws || group || !code) return;
  const LK = window.LivekitClient;
  if (!LK) { setState('error: livekit-client did not load'); return; }
  room = code;
  setState('starting');
  const r = await fetch('/lk-token?room=' + encodeURIComponent(code) + '&identity=' + encodeURIComponent(myId));
  const t = await r.json();
  if (!r.ok) { setState('error: ' + (t.error || r.status)); room = null; return; }
  const url = params.get('lk') || t.url || (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
  const lkRoom = new LK.Room({
    adaptiveStream: true, dynacast: true,
    publishDefaults: {simulcast: true, videoCodec: params.get('codec') || 'h264', dtx: params.get('dtx') !== '0'},
  });
  const G = group = {room: lkRoom, connected: false, tiles: new Map(), joined: [], left: [], speakersSeen: new Set(),
                     leaveTimer: null};
  $('events').textContent = '';
  $('local').hidden = true; $('grid').hidden = false;
  G.local = makeTile(lkRoom.localParticipant, true);
  const tile = participant => {
    let g = G.tiles.get(participant.identity);
    if (!g) { g = makeTile(participant, false); G.tiles.set(participant.identity, g); }
    g.participant = participant;
    return g;
  };
  const live = () => group === G;  // Events after Hang up (the SDK's own teardown) change nothing.
  const render = () => { if (live()) renderGroup(); };
  lkRoom.on(LK.RoomEvent.ParticipantConnected, p => {
      if (!live()) return;
      tile(p);
      if (G.connected) { G.joined.push(p.identity); logEvent(p.identity + ' joined'); }
      renderGroup();
    })
    .on(LK.RoomEvent.TrackSubscribed, (track, pub, p) => {
      if (!live()) return;
      const g = tile(p);
      g.tracks.set(pub.trackSid, track);
      if (track.kind === 'video') { track.attach(g.video); g.videoTrack = track; }
      else { g.audio = track.attach(); g.div.appendChild(g.audio); }
      renderGroup();
    })
    .on(LK.RoomEvent.TrackUnsubscribed, (track, pub, p) => {
      track.detach();
      const g = live() && G.tiles.get(p.identity);
      if (!g) return;
      g.tracks.delete(pub.trackSid);
      if (g.videoTrack === track) g.videoTrack = null;
      if (g.audio && track.kind === 'audio') { g.audio.remove(); g.audio = null; }
      renderGroup();
    })
    .on(LK.RoomEvent.ParticipantDisconnected, p => {
      const g = live() && G.tiles.get(p.identity);
      if (!g) return;
      g.div.remove(); G.tiles.delete(p.identity);
      G.left.push(p.identity); logEvent(p.identity + ' left');
      renderGroup();
    })
    .on(LK.RoomEvent.LocalTrackPublished, pub => {
      if (!live() || pub.source !== LK.Track.Source.Camera || !pub.track) return;
      pub.track.attach(G.local.video); G.local.videoTrack = pub.track;
      renderGroup();
    })
    .on(LK.RoomEvent.LocalTrackUnpublished, pub => {
      if (!live() || !pub.track || pub.track !== G.local.videoTrack) return;
      pub.track.detach(G.local.video); G.local.videoTrack = null;
      renderGroup();
    })
    .on(LK.RoomEvent.ActiveSpeakersChanged, speakers => {
      if (!live()) return;
      for (const p of speakers) G.speakersSeen.add(p.identity);
      renderGroup();
    })
    .on(LK.RoomEvent.TrackMuted, render).on(LK.RoomEvent.TrackUnmuted, render)
    .on(LK.RoomEvent.TrackPublished, render).on(LK.RoomEvent.TrackUnpublished, render)
    .on(LK.RoomEvent.ConnectionStateChanged, s => { if (live()) setState('group: ' + s); })
    .on(LK.RoomEvent.Disconnected, () => { if (live()) setState('disconnected'); });
  const rtcConfig = params.get('relay') === '1' ? {iceTransportPolicy: 'relay'} : undefined;
  try {
    await lkRoom.connect(url, t.token, rtcConfig ? {rtcConfig} : {});
  } catch (e) {
    // A full room (room.max_participants): the server closes the signal WebSocket at once ("room has exceeded its max
    // participants" in its log) and the SDK only reports a WebSocket error; its follow-up check (/rtc/validate) found
    // the server up and the token good, or the message would say so. So that error, here, means the room refused
    // this join, and a full room is the likely reason.
    const msg = String((e && e.message) || e);
    closeGroup();
    room = null;
    const full = /full|max.?participants|exceeded|websocket error during connection establishment/i.test(msg);
    setState('error: ' + (full ? `the room refused the join, likely full (${GROUP_MAX}/${GROUP_MAX}): ` : '') + msg);
    return;
  }
  G.connected = true;
  for (const p of lkRoom.remoteParticipants.values()) tile(p);
  logEvent(`you (${myId}) joined ${code}: ${lkRoom.remoteParticipants.size + 1}/${GROUP_MAX}`);
  renderGroup();
  // mic=0: the microphone is published muted (Mute unmutes it); cam=0: no camera until Video.
  const lp = lkRoom.localParticipant, micOn = params.get('mic') !== '0', camOn = params.get('cam') !== '0';
  if (micOn && camOn) {
    await lp.enableCameraAndMicrophone();
  } else {
    if (camOn) await lp.setCameraEnabled(true);
    if (micOn) await lp.setMicrophoneEnabled(true);
    else { const mic = await LK.createLocalAudioTrack(); await mic.mute(); await lp.publishTrack(mic); }
  }
  if (!live()) return;
  $('mute').textContent = micOn ? 'Mute' : 'Unmute';
  $('video').textContent = camOn ? 'Stop video' : 'Start video';
  $('mute').disabled = $('hangup').disabled = false; $('video').hidden = false;
  renderGroup();
  if (params.get('leave')) G.leaveTimer = setTimeout(() => { if (live()) hangup(); }, 1000 * +params.get('leave'));
}

function closeGroup() {
  if (!group) return;
  const G = group; group = null;
  clearTimeout(G.leaveTimer);
  G.room.disconnect();
  for (const g of [G.local, ...G.tiles.values()]) g.div.remove();
  $('grid').hidden = true; $('local').hidden = false; $('video').hidden = true; $('count').textContent = '';
  $('mute').textContent = 'Mute';
  if (G.connected) logEvent('you left');
}

// One track's getStats, added into s: received (a remote participant's tracks) or sent (this page's).
function addTrackStats(s, rep) {
  const byId = {}; rep.forEach(r => { byId[r.id] = r; });
  rep.forEach(r => {
    if (r.type === 'inbound-rtp' && r.kind === 'audio') {
      s.audioBytesIn += r.bytesReceived || 0; s.audioPacketsLost += r.packetsLost || 0;
      s.audioPacketsReceived += r.packetsReceived || 0; s.audioJitterMs = Math.round((r.jitter || 0) * 10000) / 10;
    } else if (r.type === 'inbound-rtp' && r.kind === 'video') {
      s.videoFrames += r.framesDecoded || 0; s.videoWidth = r.frameWidth || s.videoWidth;
      s.videoHeight = r.frameHeight || s.videoHeight; s.videoFps = r.framesPerSecond || 0;
      const c = byId[r.codecId]; if (c) s.videoCodec = c.mimeType;
    } else if (r.type === 'outbound-rtp' && r.kind === 'audio') {
      s.audioBytesOut += r.bytesSent || 0;
    } else if (r.type === 'outbound-rtp' && r.kind === 'video') {
      // Simulcast: one row per layer; the line shows the largest one sent.
      s.videoBytesOut += r.bytesSent || 0;
      if ((r.frameWidth || 0) >= s.videoWidth) {
        s.videoWidth = r.frameWidth || 0; s.videoHeight = r.frameHeight || 0; s.videoFps = r.framesPerSecond || 0;
      }
      const c = byId[r.codecId]; if (c) s.videoCodec = c.mimeType;
    }
  });
}

function kbps(prev, bytes, now) {  // since the last second's report
  return prev ? Math.max(0, Math.round((bytes - prev.bytes) * 8 / Math.max(1, now - prev.t))) : 0;
}

function videoText(s) {
  if (!s.videoWidth) return 'none';
  return `${s.videoWidth}x${s.videoHeight} ${Math.round(s.videoFps)} fps ${(s.videoCodec || '').replace('video/', '')}`;
}

// Per remote participant: audio bytes and decoded video frames from its tracks' receivers, its audio level, speaking,
// mic and camera state, and stats; what this page sends (the camera's simulcast encodings and codec) and its own
// state; the active speakers (and every one seen), who joined and left after this page joined, and the room's count.
// Each tile's stats line is written from the same numbers.
async function groupReport() {
  const out = {participants: {}, sending: {}};
  const G = group;
  if (!G) return out;
  const now = Date.now();
  for (const [identity, g] of G.tiles) {
    const p = g.participant;
    const s = {audioBytesIn: 0, videoFrames: 0, videoWidth: 0, videoCodec: '', videoHeight: 0, videoFps: 0,
               audioKbps: 0, audioPacketsReceived: 0, audioPacketsLost: 0, audioJitterMs: 0,
               audioLevel: Math.round(1000 * (p.audioLevel || 0)) / 1000, isSpeaking: !!p.isSpeaking,
               micMuted: micMuted(p), cameraOff: cameraOff(p)};
    for (const track of g.tracks.values()) {
      const rep = await track.getRTCStatsReport().catch(() => null);
      if (rep) addTrackStats(s, rep);
    }
    s.audioKbps = kbps(g.prev, s.audioBytesIn, now);
    g.prev = {t: now, bytes: s.audioBytesIn};
    const total = s.audioPacketsReceived + s.audioPacketsLost;
    const loss = total ? (100 * s.audioPacketsLost / total).toFixed(1) : '0.0';
    g.info.textContent = `audio ${s.micMuted ? 'muted' : s.audioKbps + ' kbps'}, loss ${loss}%, ` +
        `jitter ${s.audioJitterMs} ms\nvideo ${videoText(s)}`;
    out.participants[identity] = s;
  }
  const LK = window.LivekitClient, lp = G.room.localParticipant;
  const mine = {audioBytesOut: 0, videoBytesOut: 0, videoWidth: 0, videoHeight: 0, videoFps: 0, videoCodec: ''};
  for (const source of [LK.Track.Source.Microphone, LK.Track.Source.Camera]) {
    const pub = lp.getTrackPublication(source);
    const rep = pub && pub.track && await pub.track.getRTCStatsReport().catch(() => null);
    if (rep) addTrackStats(mine, rep);
  }
  const prev = G.local.prev || {};
  const audioKbps = kbps(prev.audio, mine.audioBytesOut, now), videoKbps = kbps(prev.video, mine.videoBytesOut, now);
  G.local.prev = {audio: {t: now, bytes: mine.audioBytesOut}, video: {t: now, bytes: mine.videoBytesOut}};
  G.local.info.textContent = `sending audio ${micMuted(lp) ? 'muted' : audioKbps + ' kbps'}\n` +
      (cameraOff(lp) ? 'camera off' : `video ${videoText(mine)}, ${videoKbps} kbps`);
  const cam = lp.getTrackPublication(LK.Track.Source.Camera);
  const sender = cam && cam.track && cam.track.sender;
  if (sender) {
    const p = sender.getParameters();
    out.sending.encodings = (p.encodings || []).map(e => ({rid: e.rid || '', active: e.active !== false,
                                                          maxBitrate: e.maxBitrate || 0}));
    out.sending.codec = (p.codecs && p.codecs[0] && p.codecs[0].mimeType) || '';
  }
  out.connection = G.room.state;
  out.identity = lp.identity || myId;
  out.micMuted = micMuted(lp);
  out.cameraOff = cameraOff(lp);
  out.activeSpeakers = G.room.activeSpeakers.map(p => p.identity);
  for (const id of out.activeSpeakers) G.speakersSeen.add(id);
  out.speakersSeen = [...G.speakersSeen];
  out.joined = [...G.joined];
  out.left = [...G.left];
  out.count = G.connected ? G.room.remoteParticipants.size + 1 : 0;
  return out;
}

function hangup() {
  closeGroup();
  for (const peer of [...calls.keys()]) { send({type: 'bye', to: peer}); drop(peer); }
  if (ws) { ws.close(); ws = null; }
  if (stream) { for (const t of stream.getTracks()) t.stop(); stream = null; }
  $('mute').disabled = $('hangup').disabled = true;
  setState('idle');
}

$('join').onclick = () => join($('room').value.trim());
$('group').onclick = () => joinGroup($('room').value.trim()).catch(e => setState('error: ' + e));
$('ai').onclick = () => { $('room').value = 'ai-' + Math.random().toString(36).slice(2, 8); join($('room').value); };
$('mute').onclick = () => {
  if (group) {
    const lp = group.room.localParticipant, on = !lp.isMicrophoneEnabled;
    lp.setMicrophoneEnabled(on).then(() => { $('mute').textContent = on ? 'Mute' : 'Unmute'; renderGroup(); })
      .catch(e => setState('error: ' + e));
    return;
  }
  const audio = stream && stream.getAudioTracks()[0];
  if (audio) { audio.enabled = !audio.enabled; $('mute').textContent = audio.enabled ? 'Mute' : 'Unmute'; }
};
$('hangup').onclick = hangup;
$('video').onclick = () => {  // Group mode: the camera.
  if (!group) return;
  const lp = group.room.localParticipant, on = !lp.isCameraEnabled;
  lp.setCameraEnabled(on).then(() => { $('video').textContent = on ? 'Stop video' : 'Start video'; renderGroup(); })
    .catch(e => setState('error: ' + e));
};

// --- The scripted user (converse=1) ---------------------------------------------------------------------------------
// Speech-like audio (sim::SpeechLike's recipe: a gliding 90-240 Hz pitch with 20 harmonics, formants near 500 and
// 1500 Hz, a 3-5.5 Hz syllable envelope), sent through a WebAudio track; the remote audio is read back through an
// analyser every 10 ms. The AI's audio is "playing" in a 10 ms frame above -40 dBFS, and has stopped after 200 ms
// below it (its first silent frame is the stop time).
let talk = null;
class Talk {
  constructor() {
    this.ctx = new AudioContext({sampleRate: 48000});
    this.dest = this.ctx.createMediaStreamDestination();
    this.track = this.dest.stream.getAudioTracks()[0];
    this.turns = 0; this.missed = 0; this.barges = 0; this.bargeMissed = 0;
    this.response = []; this.bargeStop = []; this.phase = 'pause'; this.nextTurn = null;
    this.playing = false; this.quiet = 0; this.firstQuiet = 0; this.bargeStart = null;
    this.maxTurns = +(params.get('turns') || 0); this.barge = params.get('barge') === '1';
  }
  speech(seed) {
    const rate = 48000, n = Math.round(1.5 * rate), buf = this.ctx.createBuffer(1, n, rate), x = buf.getChannelData(0);
    let r = seed * 9301 + 49297; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
    let f0 = 140, target = 160, ph = 0, sylRate = 4, sylPh = rnd() * 6.28, left = 0, peak = 0;
    for (let i = 0; i < n; i++) {
      if (left-- <= 0) { target = 90 + rnd() * 150; sylRate = 3 + rnd() * 2.5; left = (0.25 + rnd() * 0.35) * rate; }
      f0 += (target - f0) * (20 / rate); ph += 2 * Math.PI * f0 / rate; sylPh += 2 * Math.PI * sylRate / rate;
      let v = 0;
      for (let h = 1; h <= 20 && h * f0 < rate * 0.45; h++) {
        const fh = h * f0;
        v += (1 + 2 * Math.exp(-(((fh - 500) / 200) ** 2)) + 1.2 * Math.exp(-(((fh - 1500) / 300) ** 2))) / h * Math.sin(h * ph);
      }
      x[i] = v * (0.35 + 0.65 * Math.max(0, Math.sin(sylPh)));
      peak = Math.max(peak, Math.abs(x[i]));
    }
    for (let i = 0; i < n; i++) x[i] *= 0.3 / peak;
    return buf;
  }
  speak() {
    const src = this.ctx.createBufferSource();
    src.buffer = this.speech(100 + this.turns);
    src.connect(this.dest);
    const t = this.ctx.currentTime + 0.01;
    src.start(t);
    this.turns++; this.phase = 'speak'; this.speechEnd = t + src.buffer.duration;
    return t;
  }
  listen(remote) {
    const el = new Audio(); el.srcObject = remote; el.muted = true; el.play().catch(() => {});  // Chrome needs a sink.
    const an = this.ctx.createAnalyser(); an.fftSize = 512;
    this.ctx.createMediaStreamSource(remote).connect(an);
    const buf = new Float32Array(480);
    setInterval(() => {
      an.getFloatTimeDomainData(buf);
      let e = 0; for (const v of buf) e += v * v;
      this.frame(this.ctx.currentTime, Math.sqrt(e / buf.length) > 0.01);
    }, 10);
  }
  frame(t, active) {
    if (this.nextTurn === null) this.nextTurn = t + 1;
    if (active) {
      this.quiet = 0;
      if (!this.playing) { this.playing = true; this.replyStart(t); }
    } else if (this.playing && ++this.quiet === 1) {
      this.firstQuiet = t;
    } else if (this.playing && this.quiet >= 20) {
      this.playing = false; this.replyStop(this.firstQuiet);
    }
    if (this.phase === 'pause' && t >= this.nextTurn && (!this.maxTurns || this.turns < this.maxTurns)) this.speak();
    if (this.phase === 'speak' && t >= this.speechEnd) this.phase = 'wait';
    if (this.phase === 'wait' && t - this.speechEnd > 6) { this.missed++; this.pause(t, 0.5); }
    if (this.phase === 'barge-wait' && t >= this.bargeAt) this.bargeStart = this.speak();
  }
  pause(t, s) { this.phase = 'pause'; this.nextTurn = t + s; }
  replyStart(t) {
    if (this.phase !== 'wait') return;
    this.response.push(Math.round((t - this.speechEnd) * 1000));
    if (this.barge && this.turns % 2 === 1) { this.bargeAt = t + 1; this.phase = 'barge-wait'; this.barges++; }
    else this.phase = 'listen';
  }
  replyStop(t) {
    if (this.bargeStart !== null && t >= this.bargeStart) {
      const ms = Math.round((t - this.bargeStart) * 1000);
      if (ms < 1500) this.bargeStop.push(ms); else this.bargeMissed++;
      this.bargeStart = null;
    }
    if (this.phase === 'listen') this.pause(t, 0.7);
  }
  json() {
    const med = v => { if (!v.length) return -1; const s = [...v].sort((a, b) => a - b), n = s.length;
                       return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; };
    return {turns: this.turns, replies: this.response.length, missed_replies: this.missed,
            response_ms_p50: med(this.response), response_transport_ms_p50: this.response.length ? med(this.response) - 600 : -1,
            barge_ins: this.barges, barge_ins_not_stopped: this.bargeMissed, barge_in_stop_ms_p50: med(this.bargeStop),
            response_ms: this.response, barge_in_stop_ms: this.bargeStop};
  }
}

// The scripted user through the microphone (sched=, #1124): the turns are in the fake capture file, at known offsets
// from its first turn, so the browser's audio processing (APM) handles them as it handles a person's voice. The
// scoring follows Talk's: response from the end of a turn's speech to the next reply start before the following
// turn (missed if none within 6 s); a barge-in is a scheduled barge turn that starts while a reply plays, stopped
// if that reply's audio ends within 1.5 s and before its full length (the AI's replies are 3 s; 2.8 s allows for
// the jitter buffer); a barge turn with no reply playing is not a barge-in (barge_ins_skipped).
class FileTalk {
  constructor(sched, mic) {
    this.ctx = new AudioContext({sampleRate: 48000});
    this.turnsAt = sched.split(',').map(v => ({at: parseFloat(v), barge: v.endsWith('b')}));
    this.mic = mic; this.t0 = null; this.segments = []; this.playing = false; this.quiet = 0; this.firstQuiet = 0;
    this.end = null;
    const an = this.ctx.createAnalyser(); an.fftSize = 512;
    this.ctx.createMediaStreamSource(new MediaStream([mic])).connect(an);
    const buf = new Float32Array(480);
    // The first turn's end on the processed microphone (no reply plays yet): its first quiet frame of 200 ms. The
    // end, not the onset, because the processing may take a moment to pass the first syllables.
    this.onset = null; this.micEnd = null; let quiet = 0, firstQuiet = 0;
    this.micTimer = setInterval(() => {
      an.getFloatTimeDomainData(buf);
      let e = 0; for (const v of buf) e += v * v;
      const t = this.ctx.currentTime;
      if (Math.sqrt(e / buf.length) > 0.01) {
        quiet = 0; if (this.onset === null) this.onset = t;
      } else if (this.onset !== null && ++quiet === 1) {
        firstQuiet = t;
      } else if (this.onset !== null && quiet >= 20) {
        this.micEnd = firstQuiet; this.t0 = firstQuiet - this.turnsAt[0].at - 1.5; clearInterval(this.micTimer);
      }
    }, 10);
  }
  listen(remote) {
    const el = new Audio(); el.srcObject = remote; el.play().catch(() => {});  // Played out: APM's render signal.
    const an = this.ctx.createAnalyser(); an.fftSize = 512;
    this.ctx.createMediaStreamSource(remote).connect(an);
    const buf = new Float32Array(480);
    setInterval(() => {
      an.getFloatTimeDomainData(buf);
      let e = 0; for (const v of buf) e += v * v;
      this.frame(this.ctx.currentTime, Math.sqrt(e / buf.length) > 0.01);
    }, 10);
  }
  frame(t, active) {
    this.end = t;
    if (active) {
      this.quiet = 0;
      if (!this.playing) { this.playing = true; this.segments.push({start: t, stop: null}); }
    } else if (this.playing && ++this.quiet === 1) {
      this.firstQuiet = t;
    } else if (this.playing && this.quiet >= 20) {
      this.playing = false; this.segments[this.segments.length - 1].stop = this.firstQuiet;
    }
  }
  json() {
    const med = v => { if (!v.length) return -1; const s = [...v].sort((a, b) => a - b), n = s.length;
                       return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; };
    const r = {turns: 0, missed: 0, barges: 0, bargeMissed: 0, bargeSkipped: 0, response: [], bargeStop: [],
               bargeOffset: []};
    if (this.t0 !== null && this.end !== null) {
      const at = this.turnsAt.map(x => ({t: this.t0 + x.at, barge: x.barge}));
      for (let i = 0; i < at.length; i++) {
        const e = at[i].t + 1.5, until = Math.min(e + 6, i + 1 < at.length ? at[i + 1].t : Infinity);
        if (until > this.end) break;
        r.turns++;
        if (at[i].barge) {
          const seg = this.segments.find(g => g.start < at[i].t && (g.stop === null || g.stop > at[i].t));
          if (!seg) r.bargeSkipped++;
          else {
            r.barges++; r.bargeOffset.push(Math.round((at[i].t - seg.start) * 1000));
            const stop = seg.stop === null ? this.end : seg.stop, ms = Math.round((stop - at[i].t) * 1000);
            if (ms < 1500 && stop - seg.start < 2.8) r.bargeStop.push(ms); else r.bargeMissed++;
          }
        }
        const reply = this.segments.find(g => g.start > e && g.start < until);
        if (reply) r.response.push(Math.round((reply.start - e) * 1000)); else r.missed++;
      }
    }
    return {turns: r.turns, replies: r.response.length, missed_replies: r.missed,
            response_ms_p50: med(r.response), response_transport_ms_p50: r.response.length ? med(r.response) - 600 : -1,
            barge_ins: r.barges, barge_ins_not_stopped: r.bargeMissed, barge_ins_skipped: r.bargeSkipped,
            barge_in_stop_ms_p50: med(r.bargeStop), response_ms: r.response, barge_in_stop_ms: r.bargeStop,
            barge_in_offset_ms: r.bargeOffset, capture: 'getUserMedia, APM on', mic_settings: this.mic.getSettings(),
            mic_onset_s: this.onset === null ? -1 : this.onset, mic_end_s: this.micEnd === null ? -1 : this.micEnd,
            reply_segments: this.segments.map(g => [g.start - (this.t0 || 0), g.stop === null ? -1 : g.stop - (this.t0 || 0)])};
  }
}

// The call's metrics from getStats, as one object (result=1).
async function callMetrics(call) {
  const rows = await call.pc.getStats(); const byId = {}; const m = {};
  rows.forEach(r => { byId[r.id] = r; });
  let pair = null;
  rows.forEach(r => {
    if (r.type === 'transport' && r.selectedCandidatePairId) pair = byId[r.selectedCandidatePairId];
    if (r.type === 'inbound-rtp' && r.kind === 'audio') {
      m.audio_packets_received = r.packetsReceived; m.audio_packets_lost = r.packetsLost;
      m.audio_jitter_ms = Math.round((r.jitter || 0) * 1000 * 10) / 10;
      m.audio_concealed_pct = r.totalSamplesReceived ? Math.round(10000 * r.concealedSamples / r.totalSamplesReceived) / 100 : 0;
      m.jitter_buffer_ms = r.jitterBufferEmittedCount ? Math.round(10000 * r.jitterBufferDelay / r.jitterBufferEmittedCount) / 10 : 0;
    }
    if (r.type === 'inbound-rtp' && r.kind === 'video') {
      m.video_frames_decoded = r.framesDecoded; m.video_fps = r.framesPerSecond || 0;
      m.video_freezes = r.freezeCount || 0; m.video_freeze_ms = Math.round((r.totalFreezesDuration || 0) * 1000);
      m.video_recv_width = r.frameWidth || 0; m.video_recv_height = r.frameHeight || 0;
    }
    if (r.type === 'outbound-rtp' && r.kind === 'video') m.video_frames_sent = r.framesSent;
  });
  if (pair) {
    const lc = byId[pair.localCandidateId] || {}, rc = byId[pair.remoteCandidateId] || {};
    m.rtt_ms = pair.currentRoundTripTime == null ? -1 : Math.round(pair.currentRoundTripTime * 1000);
    m.target_kbps = pair.availableOutgoingBitrate == null ? -1 : Math.round(pair.availableOutgoingBitrate / 100) / 10;
    m.local_type = lc.candidateType; m.remote_type = rc.candidateType; m.protocol = lc.protocol;
    m.relay_protocol = lc.relayProtocol || '';
  }
  return m;
}

async function finish() {
  const out = {type: 'call-result', client: 'chrome', label: params.get('label') || '', room,
               relay_only: params.get('relay') === '1', user_agent: navigator.userAgent};
  for (const [peer, call] of calls) {
    out.peer = peer; out.connection = call.pc.connectionState; out.connect_ms = call.connectMs == null ? -1 : call.connectMs;
    Object.assign(out, await callMetrics(call));
  }
  if (talk) Object.assign(out, talk.json());
  if (params.get('result') === '1') await fetch('/result', {method: 'POST', body: JSON.stringify(out)}).catch(() => {});
  hangup();
  setState('done');
}

// getStats panel: RTT, bitrate, packet loss and the selected candidate type, once a second.
async function readStats(call) {
  const rows = await call.pc.getStats();
  const s = {bytesIn: 0, bytesOut: 0, packetsIn: 0, lost: 0, rtt: null, candidate: '-', videoFrames: 0, audioBytesIn: 0};
  let pair = null; const byId = {};
  rows.forEach(r => { byId[r.id] = r; });
  rows.forEach(r => {
    if (r.type === 'inbound-rtp') {
      s.bytesIn += r.bytesReceived || 0; s.packetsIn += r.packetsReceived || 0; s.lost += r.packetsLost || 0;
      if (r.kind === 'video') s.videoFrames = r.framesDecoded || 0;
      if (r.kind === 'audio') s.audioBytesIn = r.bytesReceived || 0;
    } else if (r.type === 'outbound-rtp') s.bytesOut += r.bytesSent || 0;
    else if (r.type === 'candidate-pair' && (r.selected || (r.nominated && r.state === 'succeeded'))) pair = pair || r;
  });
  if (pair) {
    s.rtt = pair.currentRoundTripTime == null ? null : Math.round(pair.currentRoundTripTime * 1000);
    const lc = byId[pair.localCandidateId];
    s.candidate = lc ? lc.candidateType : '-';
  }
  return s;
}

async function tick() {
  const lines = []; const report = {peer: myId, room, state: $('state').textContent, calls: {}};
  for (const [peer, call] of calls) {
    const s = await readStats(call);
    const now = Date.now();
    const kbps = call.prev ? Math.round((s.bytesIn - call.prev.bytes) * 8 / (now - call.prev.t)) : 0;
    call.prev = {t: now, bytes: s.bytesIn};
    const total = s.packetsIn + s.lost;
    const loss = total ? (100 * s.lost / total).toFixed(1) : '0.0';
    lines.push(`${peer}: ${call.pc.connectionState}  rtt ${s.rtt == null ? '-' : s.rtt + ' ms'}  in ${kbps} kbps  loss ${loss}%  candidate ${s.candidate}`);
    report.calls[peer] = {connection: call.pc.connectionState, ice: call.pc.iceConnectionState, bytesIn: s.bytesIn,
                          audioBytesIn: s.audioBytesIn, videoFrames: s.videoFrames, bytesOut: s.bytesOut, candidate: s.candidate};
  }
  if (group) {
    report.group = await groupReport();
    for (const [id, g] of Object.entries(report.group.participants)) {
      lines.push(`${id}: audio in ${g.audioBytesIn} B  video frames ${g.videoFrames} (${g.videoWidth} px, ${g.videoCodec || '-'})`);
    }
    const enc = report.group.sending.encodings || [];
    lines.push(`sending: ${report.group.sending.codec || '-'}, ${enc.length} simulcast encodings ${enc.map(e => e.rid).join(' ')}`);
    renderGroup();
  }
  $('stats').textContent = lines.join('\n');
  if (params.get('report') === '1' && room) {
    fetch('/report', {method: 'POST', body: JSON.stringify(report)}).catch(() => {});
  }
}
setInterval(() => tick().catch(() => {}), 1000);

if (params.get('room')) $('room').value = params.get('room');
if (params.get('auto') === '1' && params.get('room')) {
  (params.get('group') === '1' ? joinGroup : join)(params.get('room')).catch(e => setState('error: ' + e));
}
if (params.get('seconds')) setTimeout(() => finish().catch(e => setState('error: ' + e)), 1000 * +params.get('seconds'));
</script>
